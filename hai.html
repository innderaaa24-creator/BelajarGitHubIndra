<!DOCTYPE html>
<html>
<head>
    <style>
        h1 { color: red; }
    </style>
</head>
<body>

    <h1>Halo Dunia</h1>
    <button onclick="ubah()">Klik</button>

    <script>
        function ubah() {
            // Correctly changes the text color to blue
            document.querySelector("h1").style.color = "blue";
            
            // Correctly changes the page background color to pink
            document.body.style.backgroundColor = "pink";
        }
    </script>

</body>
</html>
